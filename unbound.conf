server:
	########################################################################
	# Module stack
	########################################################################
	module-config: "respip subnetcache validator cachedb iterator"


	########################################################################
	# Listen
	########################################################################

	interface: 0.0.0.0
	interface: ::
	port: 5353

	do-ip4: yes
	do-ip6: yes

	# 上游递归只走 IPv4
	do-not-query-address: ::/0

	do-udp: yes
	do-tcp: yes


	########################################################################
	# Access control
	########################################################################

	access-control: 0.0.0.0/0 allow
	access-control: ::/0 allow


	########################################################################
	# EDNS Client Subnet
	########################################################################

	send-client-subnet: 0.0.0.0/0
	send-client-subnet: ::/0
	client-subnet-always-forward: no

	# ECS 前缀
	max-client-subnet-ipv4: 24

	# IPv6 推荐 /56。
	max-client-subnet-ipv6: 56

	#
	# 每个 qname/qclass/qtype 默认只能保存 100 个 ECS subnet。
	#
	# 对公网 DNS 来说 100 很容易被热门 CDN 域名打满，
	# 增大到 512 可以显著减少 ECS cache churn。
	#
	max-ecs-tree-size-ipv4: 512
	max-ecs-tree-size-ipv6: 512


	########################################################################
	# Cache
	########################################################################
	msg-cache-size: 768m
	rrset-cache-size: 1280m
	key-cache-size: 256m
	neg-cache-size: 128m

	msg-cache-slabs: 4
	rrset-cache-slabs: 4
	key-cache-slabs: 4
	infra-cache-slabs: 4
	infra-cache-numhosts: 50000

	########################################################################
	# TTL
	########################################################################

	cache-max-ttl: 86400
	cache-min-ttl: 60

	cache-max-negative-ttl: 3600
	cache-min-negative-ttl: 0

	########################################################################
	# Prefetch
	########################################################################

	prefetch: yes
	prefetch-key: yes

	########################################################################
	# Serve stale
	########################################################################

	serve-expired: yes
	serve-expired-ttl: 86400
	serve-expired-ttl-reset: no
	serve-expired-reply-ttl: 30
	serve-expired-client-timeout: 200


	########################################################################
	# Recursive resolver performance
	########################################################################

	num-threads: 4
	num-queries-per-thread: 4096
	outgoing-range: 8192

	outgoing-num-tcp: 128
	incoming-num-tcp: 128

	so-reuseport: yes

	so-rcvbuf: 4m
	so-sndbuf: 4m

	edns-buffer-size: 1232
	max-udp-size: 1232


	########################################################################
	# Recursive target fetching
	########################################################################
	target-fetch-policy: "4 3 2 1 0"


	########################################################################
	# DNSSEC / resolver hardening
	########################################################################

	auto-trust-anchor-file: "/var/lib/unbound/root.key"
	root-hints: "/var/lib/unbound/root.hints"

	tls-cert-bundle: "/etc/ssl/certs/ca-certificates.crt"

	qname-minimisation: yes
	qname-minimisation-strict: no
	aggressive-nsec: yes
	harden-glue: yes
	harden-dnssec-stripped: yes
	harden-below-nxdomain: yes
	harden-short-bufsize: yes
	use-caps-for-id: yes

	minimal-responses: yes
	deny-any: yes

	########################################################################
	# Privacy / information leakage
	########################################################################

	hide-identity: yes
	hide-version: yes
	hide-trustanchor: yes

	########################################################################
	# Local upstream
	########################################################################

	do-not-query-localhost: no

	########################################################################
	# Statistics
	########################################################################

	extended-statistics: yes
	statistics-cumulative: yes

	val-log-level: 1
	ede: yes


remote-control:
	control-enable: yes
	control-use-cert: no
	control-interface: 127.0.0.1
	control-interface: ::1


cachedb:
	backend: redis
	secret-seed: "CHANGE_THIS_TO_A_LONG_RANDOM_FIXED_SECRET"
	redis-server-host: 127.0.0.1
	redis-server-port: 6379
	redis-timeout: 20
	redis-command-timeout: 20
	redis-connect-timeout: 100
	cachedb-check-when-serve-expired: yes
	redis-expire-records: yes
