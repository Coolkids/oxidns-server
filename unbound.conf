server:
	module-config: "respip subnetcache validator cachedb iterator"
	# 基础监听
	interface: 0.0.0.0
	interface: ::
	port: 5353
	do-ip4: yes
	do-ip6: no

	val-log-level: 2
	ede: yes
	
	# IPv4：允许所有客户端
    access-control: 0.0.0.0/0 allow
    # IPv6：允许所有客户端
    access-control: ::0/0 allow
    # IPv4 ECS
    send-client-subnet: 0.0.0.0/0
    # IPv6 ECS
    send-client-subnet: ::0/0
    	
	extended-statistics: yes
	statistics-cumulative: yes
	do-not-query-localhost: no
	use-caps-for-id: yes
	
	# 缓存
	msg-cache-size: 512m
	rrset-cache-size: 1536m
	key-cache-size: 256m
	neg-cache-size: 128m
	infra-cache-numhosts: 50000

	cache-max-ttl: 86400
	cache-min-ttl: 600

	prefetch: yes
	prefetch-key: yes

	serve-expired: yes
	serve-expired-ttl: 259200
	serve-expired-ttl-reset: yes
	serve-expired-reply-ttl: 3
	serve-expired-client-timeout: 0
	
	# 性能
	num-threads: 4                  # 启 用  2 个 线 程
	msg-cache-slabs: 4              # 锁 分 片 数 ， 必 须 与 线 程 数一 致 （ 或 为 2的 幂 ， 如 2） ， 减 少 线 程 锁 冲 突
	rrset-cache-slabs: 4
	infra-cache-slabs: 4
	key-cache-slabs: 4
	outgoing-range: 8192
	num-queries-per-thread: 4096
	so-reuseport: yes
	edns-buffer-size: 1232
	max-udp-size: 1232

	target-fetch-policy: "5 4 3 2 1"
	# DNSSEC
	auto-trust-anchor-file: "/var/lib/unbound/root.key"
	# RFC 8806 Local Root Zone
	root-hints: "/var/lib/unbound/root.hints"
	# CA
	tls-cert-bundle: "/etc/ssl/certs/ca-certificates.crt"

remote-control:
	control-enable: yes
	control-use-cert: no
	control-interface: 127.0.0.1
	control-interface: ::1

cachedb:
    backend: redis
    redis-server-host: 127.0.0.1
    redis-server-port: 6379
    redis-expire-records: yes
