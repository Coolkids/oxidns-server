[supervisord]
nodaemon=true
user=root
logfile=/dev/null
pidfile=/run/supervisord.pid
loglevel=info

[program:valkey]
command=/usr/bin/valkey-server /etc/valkey/valkey.conf --daemonize no
directory=/var/lib/valkey
user=valkey
autostart=true
autorestart=true
startsecs=2
startretries=10

stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

stopasgroup=true
killasgroup=true

[program:unbound]
command=/usr/sbin/unbound -dd -c /etc/unbound/unbound.conf
directory=/var/lib/unbound
user=root
autostart=true
autorestart=true
startsecs=2
startretries=10

stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

stopasgroup=true
killasgroup=true

[program:oxidns]
command=/usr/local/bin/oxidns start -c /etc/oxidns/config.yaml -d /etc/oxidns
directory=/etc/oxidns
user=root
autostart=true
autorestart=true
startsecs=2
startretries=10

stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

stopasgroup=true
killasgroup=true

[program:unbound-dashboard]
command=/usr/bin/python3 /opt/unbound-dashboard/server.py
directory=/opt/unbound-dashboard
autostart=true
autorestart=true
startsecs=3
priority=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0